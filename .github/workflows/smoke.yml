name: Browser Smoke

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Install Playwright Chromium (isolated from repo lockfile)
        run: |
          mkdir -p /tmp/pw-smoke
          npm --prefix /tmp/pw-smoke install --no-save playwright-core
          /tmp/pw-smoke/node_modules/.bin/playwright-core install chromium --with-deps
      - name: Run headless Chromium E2E smoke (prod + deep dev playthrough)
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 --strictPort &
          PROD_PID=$!
          pnpm dev --host 127.0.0.1 --port 4174 --strictPort &
          DEV_PID=$!
          trap "kill $PROD_PID $DEV_PID 2>/dev/null || true" EXIT
          sleep 3
          NODE_PATH=/tmp/pw-smoke/node_modules \
            PROD_URL=http://127.0.0.1:4173 \
            DEV_URL=http://127.0.0.1:4174 \
            node scripts/smoke.mjs
